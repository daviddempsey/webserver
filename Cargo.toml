[package]
name = "webserver"
version = "0.2.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "signal", "fs", "time", "sync"] }
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
